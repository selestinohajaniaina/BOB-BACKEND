services:
  postgres:
    image: postgres:16-alpine
    container_name: bob-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bob
      POSTGRES_USER: bob
      POSTGRES_PASSWORD: bob_local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - bob_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob -d bob"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bob_postgres_data:
